<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Catch all inputs</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <script>
      // Keyboard Lock only works in a secure context, and Cloudflare also serves this site over plain HTTP.
      if (!isSecureContext) location.replace(location.href.replace(/^http:/, "https:"));
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5331708202971644" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="intro">
      <h1>Every key, click and scroll stops here.</h1>
      <p id="summary">The site goes fullscreen and keeps every input to itself. Press Esc to leave.</p>
      <button id="start" type="button" autofocus>Start catching</button>
      <p id="notice" role="status" hidden></p>
    </main>

    <div id="trap" hidden>
      <output id="last">Try anything</output>
      <span id="measure" aria-hidden="true"></span>
      <ol id="trail" aria-hidden="true"></ol>
      <footer>
        <span id="count">0 caught</span>
        <span>Esc leaves</span>
      </footer>
      <div id="cursor" aria-hidden="true"></div>
    </div>
  </body>
</html>
